<!DOCTYPE html>
<html>

  <body style="font-family: Helvetica, Noto Sans, sans-serif; background-image: url(static/images/lake_image.png);">
      <div id = "topbar" style="position: absolute; width: 98.7%; display: flex; backdrop-filter: blur(10px); background-color: rgba(0, 0, 0, 0.25); color: #fff; justify-content: space-between;">
        <p style="margin-left: 16px; cursor: pointer"; id = "welcomeopen">Website</p>
        <p style="margin-right: 16px;" id = "timeElement">Time</p>
      </div>
      <div class = "selected" id = "desktopApps" style = "padding-top:64px;">
        <div id = "appyappicon" style = "text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content">
          <img src = "static/images/sinkhole_image.png" style = "width: 64px; height: 64px; border-radius: 64px">
          <p style = "margin: 0px; color: orange;">Appy App</p>
      </div>

      <div id="welcome" style="border: solid; width: 700px; border-radius: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #c9ffcf; user-select: none; -webkit-user-drag: none;">
        <p style = "cursor: pointer;" id = "welcomeclose">Close</p>
        <h1 id="welcomeheader" style = "margin: 14px; padding:4px; background-color: #000; color: #fff;">Welcome to my OS</h1>
        <h2 style = "margin: 14px">Introduction</h2>
        <p style = "color: red; margin: 14px;">Hello world!</p>
        <img draggable="false" style = "border-radius: 16px; object-fit: cover; margin: 14px;" src ="static/images/code_image.png">
        </br>
        <a style = "margin: 14px; padding: 4px;" href = "https://google.com">Google</a>
      </div>

      <div id="appyapp" style="display: none; border: solid; width: 700px; border-radius: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: lightskyblue; user-select: none; -webkit-user-drag: none;">
        <p style = "cursor: pointer;" id = "appyappclose">Close</p>
        <h1 id="appyappheader" style = "margin: 14px; padding:4px; background-color: #000; color: #fff;">Appy App</h1>
        <div style="display: flex;">
          <div id="appyappsidebar" style="width: 160px;"></div>
          <div id="appyappcontent" style="flex: 1; margin: 14px;"></div>
        </div>
      </div>

    <script>
      function updateTime(){
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentTime
      }
      setInterval(updateTime, 1000)
    </script>
    <script src = "script.js"></script>
  </body>

</html>
