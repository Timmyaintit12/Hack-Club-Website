<!DOCTYPE html>
<html>

  <body style="font-family: Helvetica, Noto Sans, sans-serif; background-image: url(static/images/lake_image.png);">
      <div id = "topbar" style="position: absolute; width: 98.7%; display: flex; backdrop-filter: blur(10px); background-color: rgba(0, 0, 0, 0.25); color: #fff; justify-content: space-between;">
        <p style="margin-left: 16px; cursor: pointer"; id = "welcomeopen">Website</p>
        <p style="margin-right: 16px;" id = "timeElement">Time</p>
      </div>
      <div class = "selected" id = "desktopApps" style = "padding-top:64px;">
        <div id = "appyappicon" style = "text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content">
          <img src = "static/images/sinkhole_image.png" style = "width: 64px; height: 64px; border-radius: 64px">
          <p style = "margin: 0px; color: orange;">Appy App</p>
      </div>

      <div id = "todoappicon" style = "text-align: center; padding: 16px; filter: drop-shadow(0 0 8px black); width: fit-content">
          <img src = "static/images/cad_image.png" style = "width: 64px; height: 64px; border-radius: 64px">
          <p style = "margin: 0px; color: blue;">To do list</p>
      </div>

      <div id="welcome" style="border: solid; width: 700px; border-radius: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #c9ffcf; user-select: none; -webkit-user-drag: none;">
        <div id="welcomeheader" style="cursor: move; display: flex; justify-content: space-between; align-items: center; margin: 14px; padding: 4px 10px; background-color: #000; color: #fff; border-radius: 8px;">
          <h1 style="margin: 0; padding: 0; font-size: 1.2em;">Welcome to my OS</h1>
          <p style="cursor: pointer; margin: 0;" id="welcomeclose">Close</p>
        </div>
        <h2 style = "margin: 14px">Introduction</h2>
        <p style = "color: lightsalmon; margin: 14px;">Hello world!</p>
        <img draggable="false" style = "border-radius: 16px; object-fit: cover; margin: 14px;" src ="static/images/code_image.png">
        </br>
        <a style = "margin: 14px; padding: 4px;" href = "https://google.com">Google</a>
      </div>

      <div id="appyapp" style="display: none; border: solid; width: 700px; border-radius: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: lightskyblue; user-select: none; -webkit-user-drag: none;">
        <div id="appyappheader" style="cursor: move; display: flex; justify-content: space-between; align-items: center; margin: 14px; padding: 4px 10px; background-color: #000; color: #fff; border-radius: 8px;">
          <h1 style="margin: 0; padding: 0; font-size: 1.2em;">Appy App</h1>
          <p style="cursor: pointer; margin: 0;" id="appyappclose">Close</p>
        </div>
        <div style="display: flex;">
          <div id="appyappsidebar" style="width: 160px;"></div>
          <div id="appyappcontent" style="flex: 1; margin: 14px;"></div>
        </div>
      </div>

      <div id="todoapp" style="display: none; border: solid; width: 700px; border-radius: 16px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #ffe9b3; user-select: none; -webkit-user-drag: none;">
        <div id="todoappheader" style="cursor: move; display: flex; justify-content: space-between; align-items: center; margin: 14px; padding: 4px 10px; background-color: #000; color: #fff; border-radius: 8px;">
          <h1 style="margin: 0; padding: 0; font-size: 1.2em;">To-Do List</h1>
          <p style="cursor: pointer; margin: 0;" id="todoappclose">Close</p>
        </div>
        <div style="margin: 14px;">
          <div style="display: flex; gap: 8px;">
            <input id="todoinput" type="text" placeholder="Add a task..." style="flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #999;">
            <button id="todoaddbtn" style="padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;">Add</button>
          </div>
          <div id="todolist" style="margin-top: 14px;"></div>
        </div>
      </div>

    <script>
      function updateTime(){
        var currentTime = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        timeText.innerHTML = currentTime
      }
      setInterval(updateTime, 1000)
    </script>
    <script src = "script.js"></script>
  </body>
</html>
